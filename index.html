<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit Baseball</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh; /* respects mobile/dynamic browser chrome */
        background: #0b0d10;
        color: #e6e6e6;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #field {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      #controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(11, 13, 16, 0.78);
        backdrop-filter: blur(6px);
        border-top: 1px solid #1d2128;
        padding: 6px 14px;
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 12px;
        color: #9aa0a6;
        pointer-events: auto;
      }
      #controls button,
      #controls select {
        background: #1a1f26;
        color: #e6e6e6;
        border: 1px solid #2a3038;
        padding: 3px 9px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #controls button:hover,
      #controls select:hover {
        background: #232932;
      }
      #controls .label {
        color: #6a7079;
      }

      /* ----- stats menu (phase 5.5) ----- */
      .menu {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, 0.94);
        z-index: 100;
        display: flex;
        flex-direction: column;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #e6e6e6;
      }
      .menu.hidden {
        display: none;
      }
      .menu-header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 12px 24px;
        border-bottom: 1px solid #1d2128;
        flex-wrap: wrap;
      }
      .menu-tabs {
        display: flex;
        gap: 6px;
      }
      .menu-tabs button {
        background: transparent;
        color: #9aa0a6;
        border: 1px solid #2a3038;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .menu-tabs button:hover {
        background: #1a1f26;
      }
      .menu-tabs button.active {
        background: #1a1f26;
        color: #f1c40f;
        border-color: #3a3f47;
      }
      .menu-breadcrumb {
        color: #6a7079;
        font-size: 12px;
        margin-left: 8px;
      }
      .menu-close {
        background: transparent;
        color: #9aa0a6;
        border: 1px solid #2a3038;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        margin-left: auto;
        cursor: pointer;
      }
      .menu-close:hover {
        background: #1a1f26;
      }
      .menu-content {
        flex: 1;
        padding: 16px 24px 80px;
        overflow-y: auto;
      }
      .menu-content h2 {
        margin: 18px 0 10px;
        font-size: 16px;
        color: #f1c40f;
      }
      .menu-content h3 {
        margin: 14px 0 6px;
        font-size: 13px;
        color: #e6e6e6;
        font-weight: bold;
      }
      .menu-content h4 {
        margin: 10px 0 4px;
        font-size: 12px;
        color: #9aa0a6;
        font-weight: normal;
      }
      .menu-content table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
        margin-bottom: 14px;
      }
      .menu-content th,
      .menu-content td {
        padding: 4px 10px;
        text-align: right;
        border-bottom: 1px solid #1d2128;
      }
      .menu-content th:first-child,
      .menu-content td:first-child {
        text-align: left;
      }
      .menu-content th {
        color: #6a7079;
        font-weight: normal;
        background: #11151a;
        position: sticky;
        top: 0;
      }
      .menu-content tr.clickable {
        cursor: pointer;
      }
      .menu-content tr.clickable:hover {
        background: #14181f;
      }
      .team-stripe {
        display: inline-block;
        width: 4px;
        height: 12px;
        margin-right: 8px;
        vertical-align: middle;
      }
      .empty-state {
        color: #6a7079;
        font-size: 12px;
        font-style: italic;
        padding: 8px 0;
      }
      .player-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 6px;
        margin-bottom: 14px;
      }
      .player-card-mini {
        background: #11151a;
        border: 1px solid #1d2128;
        color: #e6e6e6;
        padding: 8px 10px;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
      }
      .player-card-mini:hover {
        background: #1a1f26;
        border-color: #3a3f47;
      }
      .pcm-name {
        font-size: 12px;
        font-weight: bold;
      }
      .pcm-meta,
      .pcm-stat {
        font-size: 11px;
        color: #9aa0a6;
      }
      .player-view .player-header {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 12px 0;
        margin-bottom: 16px;
        border-bottom: 1px solid #1d2128;
      }
      .player-portrait {
        width: 64px;
        height: 64px;
        position: relative;
        flex: 0 0 auto;
        border: 2px solid #1d2128;
      }
      .player-portrait-cap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 22px;
      }
      .player-bio h2 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #f1c40f;
      }
      .player-bio .player-line {
        font-size: 12px;
      }
      .player-bio .player-meta {
        font-size: 11px;
        color: #9aa0a6;
      }
      .player-tags {
        margin-top: 6px;
      }
      .player-tags .tag {
        display: inline-block;
        background: #1a1f26;
        border: 1px solid #2a3038;
        padding: 2px 6px;
        font-size: 10px;
        color: #f1c40f;
        margin-right: 4px;
      }
      .menu-hint {
        color: #6a7079;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="field"></canvas>
      <div id="controls">
        <button id="play-pause">▶ play</button>
        <span class="label">speed</span>
        <select id="speed"></select>
        <span class="label" id="channel-label">ch —</span>
        <span class="label">← / → cycle channels · 1–8 jump</span>
        <span class="label">[Tab] stats menu</span>
        <span class="label" style="margin-left: auto">8-bit baseball</span>
      </div>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
