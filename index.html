<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit Baseball</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh; /* respects mobile/dynamic browser chrome */
        background: #0b0d10;
        color: #e6e6e6;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #field {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
      }
      #controls {
        flex: 0 0 auto;
        background: rgba(11, 13, 16, 0.92);
        border-top: 1px solid #1d2128;
        padding: 6px 14px;
        padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        font-size: 12px;
        color: #9aa0a6;
        pointer-events: auto;
      }
      /* On phones the keyboard hints aren't useful — collapse to icons + the
         menu button so the bar still fits at 360 CSS px. */
      @media (max-width: 640px) {
        #controls {
          gap: 8px;
          padding: 6px 8px;
          font-size: 11px;
        }
        #controls .keyboard-hint {
          display: none;
        }
      }
      #controls button,
      #controls select {
        background: #1a1f26;
        color: #e6e6e6;
        border: 1px solid #2a3038;
        padding: 3px 9px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #controls button:hover,
      #controls select:hover {
        background: #232932;
      }
      #controls .label {
        color: #6a7079;
      }

      /* ----- stats menu (phase 5.5) ----- */
      .menu {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, 0.94);
        z-index: 100;
        display: flex;
        flex-direction: column;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #e6e6e6;
      }
      .menu.hidden {
        display: none;
      }
      .menu-header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 12px 24px;
        border-bottom: 1px solid #1d2128;
        flex-wrap: wrap;
      }
      .menu-tabs {
        display: flex;
        gap: 6px;
      }
      .menu-tabs button {
        background: transparent;
        color: #9aa0a6;
        border: 1px solid #2a3038;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .menu-tabs button:hover {
        background: #1a1f26;
      }
      .menu-tabs button.active {
        background: #1a1f26;
        color: #f1c40f;
        border-color: #3a3f47;
      }
      .menu-breadcrumb {
        color: #6a7079;
        font-size: 12px;
        margin-left: 8px;
      }
      .menu-close {
        background: transparent;
        color: #9aa0a6;
        border: 1px solid #2a3038;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        margin-left: auto;
        cursor: pointer;
      }
      .menu-close:hover {
        background: #1a1f26;
      }
      .menu-content {
        flex: 1;
        padding: 16px 24px 80px;
        overflow-y: auto;
      }
      .menu-content h2 {
        margin: 18px 0 10px;
        font-size: 16px;
        color: #f1c40f;
      }
      .menu-content h3 {
        margin: 14px 0 6px;
        font-size: 13px;
        color: #e6e6e6;
        font-weight: bold;
      }
      .menu-content h4 {
        margin: 10px 0 4px;
        font-size: 12px;
        color: #9aa0a6;
        font-weight: normal;
      }
      .menu-content table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
        margin-bottom: 14px;
      }
      .menu-content th,
      .menu-content td {
        padding: 4px 10px;
        text-align: right;
        border-bottom: 1px solid #1d2128;
      }
      .menu-content th:first-child,
      .menu-content td:first-child {
        text-align: left;
      }
      .menu-content th {
        color: #6a7079;
        font-weight: normal;
        background: #11151a;
        position: sticky;
        top: 0;
      }
      .menu-content tr.clickable {
        cursor: pointer;
      }
      .menu-content tr.clickable:hover {
        background: #14181f;
      }
      .team-stripe {
        display: inline-block;
        width: 4px;
        height: 12px;
        margin-right: 8px;
        vertical-align: middle;
      }
      .empty-state {
        color: #6a7079;
        font-size: 12px;
        font-style: italic;
        padding: 8px 0;
      }
      .player-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 6px;
        margin-bottom: 14px;
      }
      .player-card-mini {
        background: #11151a;
        border: 1px solid #1d2128;
        color: #e6e6e6;
        padding: 8px 10px;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
      }
      .player-card-mini:hover {
        background: #1a1f26;
        border-color: #3a3f47;
      }
      .pcm-name {
        font-size: 12px;
        font-weight: bold;
      }
      .pcm-meta,
      .pcm-stat {
        font-size: 11px;
        color: #9aa0a6;
      }
      .player-view .player-header {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 12px 0;
        margin-bottom: 16px;
        border-bottom: 1px solid #1d2128;
      }
      .player-portrait {
        width: 64px;
        height: 64px;
        position: relative;
        flex: 0 0 auto;
        border: 2px solid #1d2128;
      }
      .player-portrait-cap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 22px;
      }
      .player-bio h2 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #f1c40f;
      }
      .player-bio .player-line {
        font-size: 12px;
      }
      .player-bio .player-meta {
        font-size: 11px;
        color: #9aa0a6;
      }
      .player-tags {
        margin-top: 6px;
      }
      .player-tags .tag {
        display: inline-block;
        background: #1a1f26;
        border: 1px solid #2a3038;
        padding: 2px 6px;
        font-size: 10px;
        color: #f1c40f;
        margin-right: 4px;
      }
      .menu-hint {
        color: #6a7079;
        font-size: 11px;
        padding: 6px 0;
      }

      /* ----- Awards-watch row ----- */
      .awards-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }
      .awards-col {
        background: #11151a;
        border: 1px solid #1d2128;
        padding: 10px 12px;
      }
      .awards-col h3 {
        color: #f1c40f;
        margin: 0 0 6px;
      }
      .awards-col ol {
        margin: 0;
        padding-left: 20px;
        font-size: 12px;
      }
      .awards-col li {
        cursor: pointer;
        padding: 1px 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .awards-col li:hover {
        color: #f1c40f;
      }
      .awards-col .aw-score {
        color: #6a7079;
      }

      /* ----- Team views ----- */
      .team-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .team-card {
        background: #11151a;
        border: 1px solid #1d2128;
        border-left-width: 4px;
        color: #e6e6e6;
        padding: 10px 12px;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
      }
      .team-card:hover {
        background: #1a1f26;
      }
      .tc-name {
        font-size: 13px;
        font-weight: bold;
      }
      .tc-nickname {
        font-size: 12px;
      }
      .tc-meta {
        font-size: 11px;
        color: #6a7079;
        margin-top: 4px;
      }
      .team-view .team-header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 0;
        margin-bottom: 12px;
        border-bottom: 1px solid #1d2128;
      }
      .team-banner {
        width: 64px;
        height: 64px;
        border: 3px solid;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .team-mascot {
        font-size: 11px;
        text-align: center;
        color: #fff;
        font-weight: bold;
      }
      .team-bio h2 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #f1c40f;
      }
      .team-bio .team-line {
        font-size: 12px;
      }
      .team-bio .team-meta {
        font-size: 11px;
        color: #9aa0a6;
        margin-top: 4px;
      }
      .team-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .team-tabs button {
        background: transparent;
        color: #9aa0a6;
        border: 1px solid #2a3038;
        padding: 5px 10px;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .team-tabs button.active {
        background: #1a1f26;
        color: #f1c40f;
        border-color: #3a3f47;
      }
      .menu-content tr.dim {
        color: #6a7079;
      }

      /* ----- Player view: portrait + attributes ----- */
      .player-portrait-canvas {
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        flex: 0 0 auto;
        border: 2px solid #1d2128;
      }
      .player-bio h2 .heat {
        font-size: 11px;
        padding: 1px 6px;
        margin-left: 6px;
        border: 1px solid #2a3038;
        vertical-align: middle;
      }
      .heat-hot {
        color: #ff6b35;
        border-color: #ff6b35;
      }
      .heat-cold {
        color: #6ab0ff;
        border-color: #6ab0ff;
      }
      .attr-group {
        margin-bottom: 12px;
      }
      .attr-group h4 {
        margin: 8px 0 4px;
        color: #9aa0a6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .attr-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .attr-row {
        padding: 4px 0;
        border-bottom: 1px solid #1a1e24;
      }
      .attr-row:last-child {
        border-bottom: none;
      }
      .attr-row-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 12px;
      }
      .attr-row-header .attr-name {
        color: #e6e6e6;
        min-width: 130px;
      }
      .attr-row-header .attr-stars {
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .attr-row-header .attr-label {
        color: #6a7079;
        font-size: 11px;
      }
      .attr-desc {
        color: #b8bec6;
        font-size: 11px;
        line-height: 1.4;
        margin-top: 2px;
      }
      .attr-quant {
        color: #5a606a;
        font-size: 10px;
        line-height: 1.4;
        margin-top: 1px;
      }
      .attr-red {
        color: #d35454;
      }
      .attr-yellow {
        color: #d6a83a;
      }
      .attr-green {
        color: #6dbb56;
      }
      .attr-gold {
        color: #f1c40f;
      }
      .split-select {
        background: #11151a;
        color: #e6e6e6;
        border: 1px solid #2a3038;
        padding: 4px 8px;
        font-family: inherit;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .spray-canvas,
      .wp-canvas {
        display: block;
        width: 100%;
        max-width: 720px;
        image-rendering: pixelated;
        margin-top: 6px;
        border: 1px solid #1d2128;
      }
      .spray-canvas {
        max-width: 400px;
      }
      .heat-map-canvas {
        display: block;
        max-width: 220px;
        image-rendering: pixelated;
        margin-top: 6px;
        border: 1px solid #1d2128;
      }
      .zone-grid {
        display: grid;
        grid-template-columns: repeat(3, 60px);
        grid-template-rows: repeat(3, 50px);
        gap: 2px;
        margin-top: 6px;
        background: #1d2128;
        padding: 2px;
        width: max-content;
      }
      .zone-cell {
        background: rgba(40, 50, 65, 0.5);
        color: #e6e6e6;
        font-family: inherit;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 11px;
      }
      .zone-cell-avg {
        font-size: 14px;
        font-weight: bold;
      }
      .zone-cell-avg.dim {
        color: #7d848d;
      }
      .zone-cell-ab {
        color: #7d848d;
        font-size: 10px;
      }

      /* ----- Live view ----- */
      .live-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .live-tile {
        background: #11151a;
        border: 1px solid #1d2128;
        color: #e6e6e6;
        padding: 6px 8px;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
      }
      .live-tile.selected {
        border-color: #f1c40f;
      }
      .live-tile:hover {
        background: #1a1f26;
      }
      .lt-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 1px 0;
      }
      .lt-stripe {
        display: inline-block;
        width: 4px;
        height: 12px;
      }
      .lt-name {
        flex: 1;
      }
      .lt-score {
        font-weight: bold;
        color: #f1c40f;
      }
      .lt-meta {
        font-size: 10px;
        color: #6a7079;
        padding-top: 2px;
      }
      .lt-spark {
        display: block;
        width: 100%;
        margin-top: 4px;
        image-rendering: pixelated;
      }
      .live-detail {
        background: #11151a;
        border: 1px solid #1d2128;
        padding: 10px 14px;
      }
      .big-plays {
        margin-top: 10px;
      }
      .big-plays h4 {
        color: #f1c40f;
        margin: 6px 0 4px;
      }
      .big-plays ul {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 12px;
      }
      .big-plays li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
        border-bottom: 1px solid #1d2128;
      }
      .bp-inning {
        color: #6a7079;
        flex: 0 0 30px;
      }
      .bp-delta {
        color: #f1c40f;
      }
      .live-watch {
        background: #f1c40f;
        color: #0b0d10;
        border: none;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      .live-watch:hover {
        background: #fff;
      }

      /* ----- Phase 6: navigation, history, sortable leaderboards ----- */
      .menu-back {
        background: transparent;
        color: #f1c40f;
        border: 1px solid #3a3f47;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .menu-back:hover {
        background: #1a1f26;
      }
      .menu-back[hidden] {
        display: none;
      }
      .player-link {
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font-family: inherit;
        font-size: inherit;
        color: #f1c40f;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .player-link:hover {
        color: #fff;
        text-decoration-color: #fff;
      }
      .history-nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .hist-card {
        background: #11151a;
        border: 1px solid #2a3038;
        color: #e6e6e6;
        padding: 12px 14px;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
      }
      .hist-card:hover {
        background: #1a1f26;
        border-color: #f1c40f;
      }
      .hist-card-title {
        font-size: 13px;
        font-weight: bold;
        color: #f1c40f;
      }
      .hist-card-meta {
        font-size: 11px;
        color: #9aa0a6;
        margin-top: 4px;
      }
      .hist-go {
        color: #6a7079;
      }
      .season-summary {
        background: #11151a;
        border: 1px solid #1d2128;
        padding: 10px 14px;
        margin-bottom: 14px;
      }
      .ss-trophy {
        font-size: 14px;
        font-weight: bold;
        color: #f1c40f;
        margin-bottom: 4px;
      }
      .ss-runnerup {
        font-size: 12px;
        color: #9aa0a6;
        margin-bottom: 6px;
      }
      .ss-awards {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 12px;
      }
      .record-block {
        margin-bottom: 12px;
      }
      .record-block h4 {
        margin: 8px 0 2px;
        color: #f1c40f;
      }
      .hof-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
      .hof-card {
        background: #11151a;
        border: 1px solid #2a3038;
        padding: 10px 12px;
      }
      .hof-name {
        font-size: 13px;
        font-weight: bold;
        color: #f1c40f;
      }
      .hof-meta {
        font-size: 11px;
        color: #9aa0a6;
        margin-top: 2px;
      }
      .hof-summary {
        font-size: 11px;
        color: #e6e6e6;
        margin-top: 4px;
      }

      .sortable-table thead th.sortable {
        cursor: pointer;
        user-select: none;
      }
      .sortable-table thead th.sortable:hover {
        color: #e6e6e6;
      }
      .sortable-table thead th.active-sort {
        color: #f1c40f;
        background: #14181f;
      }
      .career-total td {
        border-top: 1px solid #3a3f47;
        font-weight: bold;
        color: #f1c40f;
      }
      .game-log {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="field"></canvas>
      <div id="controls">
        <button id="play-pause">▶ play</button>
        <span class="label">speed</span>
        <select id="speed"></select>
        <button id="prev-channel" aria-label="Previous channel">◀</button>
        <span class="label" id="channel-label">ch —</span>
        <button id="next-channel" aria-label="Next channel">▶</button>
        <span class="label keyboard-hint">← / → cycle channels · 1–8 jump</span>
        <button id="open-menu" style="margin-left: auto">☰ menu</button>
        <button id="audio-toggle">🔇 audio</button>
        <span class="label keyboard-hint">8-bit baseball</span>
      </div>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
