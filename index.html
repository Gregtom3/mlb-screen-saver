<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit Baseball</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh; /* respects mobile/dynamic browser chrome */
        background: #0b0d10;
        color: #e6e6e6;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #field {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      #controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(11, 13, 16, 0.78);
        backdrop-filter: blur(6px);
        border-top: 1px solid #1d2128;
        padding: 6px 14px;
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 12px;
        color: #9aa0a6;
        pointer-events: auto;
      }
      #controls button,
      #controls select {
        background: #1a1f26;
        color: #e6e6e6;
        border: 1px solid #2a3038;
        padding: 3px 9px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #controls button:hover,
      #controls select:hover {
        background: #232932;
      }
      #controls .label {
        color: #6a7079;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="field"></canvas>
      <div id="controls">
        <button id="play-pause">▶ play</button>
        <span class="label">speed</span>
        <select id="speed"></select>
        <span class="label" id="channel-label">ch —</span>
        <span class="label">← / → cycle channels · 1–8 jump</span>
        <span class="label" style="margin-left: auto">8-bit baseball</span>
      </div>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
