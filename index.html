<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-Bit Baseball</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6e6e6;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: 1fr auto;
        height: 100vh;
        width: 100vw;
      }
      #field {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      #controls {
        background: #11151a;
        border-top: 1px solid #1d2128;
        padding: 8px 16px;
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 12px;
        color: #9aa0a6;
      }
      #controls button,
      #controls select {
        background: #1a1f26;
        color: #e6e6e6;
        border: 1px solid #2a3038;
        padding: 4px 10px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #controls button:hover,
      #controls select:hover {
        background: #232932;
      }
      #controls .label {
        color: #6a7079;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="field"></canvas>
      <div id="controls">
        <button id="play-pause">▶ play</button>
        <span class="label">speed</span>
        <select id="speed"></select>
        <span class="label" style="margin-left: auto">8-bit baseball — phase 2 prototype</span>
      </div>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
